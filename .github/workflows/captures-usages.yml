name: Captures du prototype Uniion
on:
  workflow_dispatch:
  push:
    branches: [feature/formations]
    paths:
      - .github/workflows/captures-usages.yml
      - scripts/captures-usages.cjs
permissions:
  contents: read
jobs:
  captures:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Lire le dépôt
        uses: actions/checkout@v4
      - name: Installer Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Installer les dépendances de capture
        run: npm install --no-save --package-lock=false playwright@1.56.1 react@18.3.1 react-dom@18.3.1
      - name: Installer Chromium
        run: npx playwright install --with-deps chromium
      - name: Capturer le prototype original
        run: node scripts/captures-usages.cjs
      - name: Conserver les captures et le rapport
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: captures-usages-originales
          path: output/captures-usages/
          if-no-files-found: warn
          retention-days: 7
